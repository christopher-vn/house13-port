plugins {
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'ru.house13.lwjgl3.Lwjgl3Launcher'
}

run {
    // Рабочая директория = корень проекта (не обязательна, т.к. ассеты в classpath)
    workingDir = rootProject.file('.')
    // Проброс системного свойства запуска gradle в JVM игры (CI/песочница):
    //   ./gradlew lwjgl3:run -Dhouse13.dump=true
    if (System.getProperty('house13.dump') != null) {
        systemProperty 'house13.dump', System.getProperty('house13.dump')
    }
}
