plugins {
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'ru.house13.lwjgl3.Lwjgl3Launcher'
}

run {
    // Рабочая директория = корень проекта (не обязательна, т.к. ассеты в classpath)
    workingDir = rootProject.file('.')
    // Проброс отладочных свойств запуска gradle в JVM игры (CI/песочница):
    //   ./gradlew lwjgl3:run -Dhouse13.dump=menu.png -Dhouse13.dump.tick=30
    ['house13.dump', 'house13.dump.tick', 'house13.exp', 'house13.room',
     'house13.start', 'house13.script', 'house13.audio'].each { p ->
        if (System.getProperty(p) != null) {
            systemProperty p, System.getProperty(p)
        }
    }
}
