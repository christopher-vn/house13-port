plugins {
    id 'java-library'
}

java {
    // Уровень языка 17 (байткод совместим), но компилятор/запуск — JDK 21
    // через toolchain: сборка не зависит от того, каким JDK запущен демон
    // Gradle (частая ошибка «invalid source release: 17» / «does not provide
    // the required capabilities: JAVA_COMPILER», когда JAVA_HOME указывает
    // на старую Java или JRE). Toolchain сам найдёт JDK 21 в системе.
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // libGDX ядро: графика, ввод, аудио, файлы
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    // FreeType: растеризация TTF -> BitmapFont (кириллица; системного шрифта, как в J2ME, нет)
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// Игровые ассеты лежат в корне проекта (assets/) и попадают в core.jar,
// поэтому Gdx.files.internal("back1.png") работает на десктопе (classpath);
// на этапе 6 Android-модуль подключит ту же папку через sourceSets.
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', rootProject.file('assets')]
        }
    }
}
